name: Daily collection and two-agent analysis
on:
  schedule:
    - cron: '17 7 * * *' # UTC; scheduled runs can be delayed
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and analyze
        run: python radar.py daily
      - name: Commit persistent database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar.sqlite3
          git diff --cached --quiet || (git commit -m 'Store daily research snapshot' && git push)
  
