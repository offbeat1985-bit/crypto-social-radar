name: Weekly research report

on:
  schedule:
    - cron: '43 8 * * 0' # Sunday UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate report
        run: python radar.py weekly

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/latest.md
          git diff --cached --quiet || (git commit -m 'Update weekly research report' && git push)

      - name: Publish weekly GitHub Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Social Radar weekly report $(date -u +%F)" --body-file reports/latest.md
          
