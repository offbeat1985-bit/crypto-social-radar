
name: Apply v4.2 fixes
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-data
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python upgrade42.py
      - name: Validate syntax
        run: python -m compileall -q discovery.py validation41.py dex_report.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add discovery.py validation41.py dex_report.py
          git diff --cached --quiet || (git commit -m 'Apply v4.2 discovery and review fixes' && git push)
